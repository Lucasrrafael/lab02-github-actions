name: Etapa 2 - Build V2 (jobs paralelos)

# Alternativa 2: três jobs independentes (sem "needs"), executados em paralelo em runners separados
on:
  push:
    branches: [main]
    paths:
      - "etapa2-projeto-pronto/**"
      - ".github/workflows/etapa2-*.yml"

defaults:
  run:
    working-directory: etapa2-projeto-pronto

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  test:
    #needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
  deploy:
    #needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Build code
        run: npm run build
      - name: Deploy code
        run: echo "Deploying..."
